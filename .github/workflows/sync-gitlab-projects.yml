name: Sync service projects to GitLab
run-name: "GitLab 수동 게시 · ${{ inputs.project }} · ${{ inputs.source_sha }}"

on:
  workflow_dispatch:
    inputs:
      project:
        description: "게시를 승인할 프로젝트 (all은 네 프로젝트 모두)"
        type: choice
        required: true
        default: check
        options: [check, baton, kjon, home, all]
      source_sha:
        description: "게시할 GitHub 원본 커밋 SHA 전체 40자리"
        type: string
        required: true
      approved:
        description: "선택한 프로젝트의 제출본을 위 커밋으로 갱신하는 것을 승인합니다"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gitlab-manual-publication
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, minslab-gitlab-sync]
    timeout-minutes: 30
    steps:
      # Pin the controller to the dispatch commit, and export only source_sha.
      # Neither a queued execution nor a rerun may implicitly choose newer main.
      - name: Check out complete source history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish approved projects and source
        env:
          PROJECT: ${{ inputs.project }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          APPROVED: ${{ inputs.approved }}
          GITLAB_USERNAME: gitlab-sync
          GITLAB_KJON_TOKEN: ${{ secrets.GITLAB_KJON_TOKEN }}
          GITLAB_HOME_TOKEN: ${{ secrets.GITLAB_HOME_TOKEN }}
          GITLAB_CHECK_TOKEN: ${{ secrets.GITLAB_CHECK_TOKEN }}
          GITLAB_BATON_TOKEN: ${{ secrets.GITLAB_BATON_TOKEN }}
        run: |
          if [[ "$APPROVED" != true ]]; then
            echo "::error::제출본 갱신 승인이 필요합니다."
            exit 1
          fi
          python3 deploy/gitlab_sync.py "$PROJECT" --source "$SOURCE_SHA" --approve-source "$SOURCE_SHA" --push --diagnose
