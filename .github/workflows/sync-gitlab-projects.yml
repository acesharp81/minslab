name: Sync service projects to GitLab

on:
  push:
    branches: [main]
    paths:
      - "PoC/07-NationalAssembly/**"
      - "PoC/10-home/**"
      - "deploy/gitlab_sync.py"
      - "deploy/gitlab-runner/**"
      - ".github/workflows/sync-gitlab-projects.yml"
  workflow_dispatch:
    inputs:
      project:
        description: "동기화할 프로젝트"
        type: choice
        required: true
        default: all
        options: [all, kjon, home]

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, minslab-gitlab-sync]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.project != 'all' && (inputs.project == 'home' && '{"include":[{"project":"home","token_secret":"GITLAB_HOME_TOKEN"}]}' || '{"include":[{"project":"kjon","token_secret":"GITLAB_KJON_TOKEN"}]}') || '{"include":[{"project":"kjon","token_secret":"GITLAB_KJON_TOKEN"},{"project":"home","token_secret":"GITLAB_HOME_TOKEN"}]}') }}
    concurrency:
      group: gitlab-project-${{ matrix.project }}
      cancel-in-progress: false
    steps:
      # Read the newest main after acquiring the project lock, so a queued old
      # event cannot publish an older revision after a newer event.
      - name: Check out complete source history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Publish selected project
        env:
          PROJECT: ${{ matrix.project }}
          TOKEN_SECRET_NAME: ${{ matrix.token_secret }}
          GITLAB_USERNAME: gitlab-sync
          GITLAB_TOKEN: ${{ secrets[matrix.token_secret] }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::${TOKEN_SECRET_NAME} secret에 해당 프로젝트의 액세스 토큰을 등록하세요."
            exit 1
          fi
          python3 deploy/gitlab_sync.py "$PROJECT" --push --diagnose
