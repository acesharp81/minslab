name: Sync service projects to GitLab
run-name: "GitLab ${{ github.event_name }} · ${{ inputs.project || 'changed projects' }} · ${{ inputs.source_sha || github.sha }}"

on:
  push:
    branches: [main]
    paths:
      - 'PoC/07-NationalAssembly/**'
      - 'PoC/08-AICommonPlatformRadar/**'
      - 'PoC/10-home/**'
      - 'PoC/13-handover/**'
      - '!PoC/**/docs/evidence/**'
      - '!PoC/**/data/recovery/**'
      - '.github/workflows/sync-gitlab-projects.yml'
      - 'deploy/gitlab_sync*.py'
      - 'deploy/gitlab-runner/**'
      - 'deploy/gitlab-projects/**'
  workflow_dispatch:
    inputs:
      project:
        description: "게시를 승인할 프로젝트 (all은 네 프로젝트 모두)"
        type: choice
        required: true
        default: check
        options: [check, baton, kjon, home, all]
      source_sha:
        description: "게시할 GitHub 원본 커밋 SHA 전체 40자리"
        type: string
        required: true
      approved:
        description: "선택한 프로젝트의 제출본을 위 커밋으로 갱신하는 것을 승인합니다"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gitlab-manual-publication
  cancel-in-progress: false

jobs:
  sync:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, minslab-gitlab-sync]
    timeout-minutes: 30
    env:
      GITLAB_SYNC_POLICY: project-auto-v1
    steps:
      # Pin both push and manual runs to their event commit, never a newer main.
      - name: Check out complete source history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish selected project snapshots
        env:
          GITLAB_USERNAME: gitlab-sync
          GITLAB_KJON_TOKEN: ${{ secrets.GITLAB_KJON_TOKEN }}
          GITLAB_HOME_TOKEN: ${{ secrets.GITLAB_HOME_TOKEN }}
          GITLAB_CHECK_TOKEN: ${{ secrets.GITLAB_CHECK_TOKEN }}
          GITLAB_BATON_TOKEN: ${{ secrets.GITLAB_BATON_TOKEN }}
        run: python3 deploy/gitlab_sync_event.py
