<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>북한 VIIRS 야간조명 시계열</title>
  <script src="https://unpkg.com/deck.gl@9.1.14/dist.min.js"></script>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050914;color:#edf6ff;font-family:Inter,Pretendard,system-ui,sans-serif}
    #map{position:absolute;inset:0}.top{position:fixed;z-index:20;top:16px;left:16px;right:16px;display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:10px;pointer-events:none}
    .info,.timeline{pointer-events:auto;border:1px solid rgba(133,194,255,.28);border-radius:15px;background:rgba(5,12,28,.9);box-shadow:0 12px 34px rgba(0,0,0,.32);backdrop-filter:blur(10px)}
    .info{padding:14px 16px}.info h1{margin:0;font-size:17px}.info p{margin:6px 0 0;color:#aebed2;font-size:11px;line-height:1.5}.status{color:#dfff56}
    .timeline{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px}.play{min-width:90px;padding:10px 13px;border:1px solid #dfff56;border-radius:10px;background:#dfff56;color:#11160e;font-weight:900;cursor:pointer}.play.playing{background:transparent;color:#dfff56}.city-toggle{display:flex;align-items:center;gap:7px;padding:9px 10px;border:1px solid #4c5549;border-radius:9px;color:#d6ded2;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer}.city-toggle input{width:15px;height:15px;margin:0;accent-color:#dfff56;cursor:pointer}
    .months{display:flex;gap:6px;min-width:0;overflow-x:auto;padding:2px;scrollbar-width:thin}.month{flex:none;padding:8px 10px;border:1px solid #4c5549;border-radius:9px;background:#202720;color:#bdc8b9;font:700 11px ui-monospace,monospace;cursor:pointer}.month.partial{border-color:#c28d37;color:#f2c779}.month.sparse{border-color:#a65454;color:#f19a94}.month.active{border-color:#dfff56;background:#dfff56;color:#11160e}.current{min-width:82px;text-align:right}.current b{display:block;color:#dfff56;font:800 13px ui-monospace,monospace}.current small{color:#93a08f;font-size:9px}
    .legend{position:fixed;z-index:15;left:18px;bottom:18px;width:260px;padding:11px 13px;border:1px solid rgba(133,194,255,.24);border-radius:12px;background:rgba(5,12,28,.86)}.gradient{height:8px;border-radius:8px;background:linear-gradient(90deg,rgb(8,14,36),rgb(35,116,133),rgb(232,216,90),rgb(245,137,55),rgb(255,244,210))}.range{display:flex;justify-content:space-between;margin-top:5px;color:#91a5bc;font-size:10px}
    .attribution{position:fixed;z-index:16;right:8px;bottom:7px;padding:3px 6px;border-radius:5px;background:rgba(5,12,28,.72);color:#8290a1;font-size:9px}.attribution a{color:#aebed2}
    body.embed .top,body.embed .legend{display:none}
    @media(max-width:850px){.top{grid-template-columns:1fr}.info{display:none}.timeline{grid-template-columns:auto auto 1fr}.months{grid-column:1/-1;grid-row:2}.current{min-width:0}}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="top">
    <section class="info"><h1>북한 VIIRS 야간조명 시계열</h1><p><span class="status" id="status">월별 목록 확인 중</span><br>북한 경계 · cf_cvg &gt; 0 · 약 463.83m · 높이 log1p(avg_rad)<br>Top 3 표기: 상위 격자 좌표의 GeoNames 최근접 도시</p></section>
    <section class="timeline"><button class="play" id="play" type="button">▶ 재생</button><label class="city-toggle"><input id="cityLabels" type="checkbox">도시 이름 표시</label><div class="months" id="months"></div><div class="current"><b id="current">--</b><small>1.5초/장 · 무한 반복</small></div></section>
  </div>
  <aside class="legend"><div class="gradient"></div><div class="range"><span>0</span><span>avg_rad 60+</span></div></aside>
  <div class="attribution">도시명 © <a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a> CC BY 4.0 · 지도 © OpenStreetMap © CARTO</div>
  <script>
    const params=new URLSearchParams(location.search),embed=params.get('embed')==='1';if(embed)document.body.classList.add('embed');
    const statusEl=document.getElementById('status'),monthsEl=document.getElementById('months'),currentEl=document.getElementById('current'),playEl=document.getElementById('play'),cityLabelsEl=document.getElementById('cityLabels');
    let maps=[],activeIndex=0,timer=null,requestId=0,currentPayload=null,showCityLabels=false;const cache=new Map();
    const deckgl=new deck.DeckGL({container:'map',initialViewState:{longitude:127.15,latitude:40.15,zoom:6.15,minZoom:4,maxZoom:14,pitch:52,bearing:-12},controller:true,layers:[],getTooltip:({object,layer})=>{if(layer?.id.startsWith('viirs-grid-')&&Array.isArray(object))return {html:`<b>VIIRS 월 야간조명</b><br>avg_rad: <b>${object[2]}</b> nW/sr/cm²<br>cf_cvg: <b>${object[3]}</b>회<br>log1p: <b>${object[4]}</b><br>${object[1]}, ${object[0]}`};if(layer?.id.startsWith('top3-point-')&&object)return {html:`<b>${object.rank}위 · ${object.city}</b><br>avg_rad: <b>${object.avg_rad}</b> nW/sr/cm²<br>cf_cvg: ${object.cf_cvg}회<br>최근접 도시 거리: ${object.distance_km}km<br>${object.lat}, ${object.lon}`};return null}});
    function basemap(){return new deck.TileLayer({id:'carto-dark-basemap',data:'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png',minZoom:0,maxZoom:19,tileSize:256,pickable:false,renderSubLayers:props=>{const {west,south,east,north}=props.tile.bbox;return new deck.BitmapLayer(props,{data:null,image:props.data,bounds:[west,south,east,north]})}})}
    function cellKey(cell){return Math.round((cell[0]-120)*1e6)*1e7+Math.round((cell[1]-35)*1e6)}
    function alignPayload(previous,payload){const incoming=new Map();for(const cell of payload.data)incoming.set(cellKey(cell),cell);const aligned=new Array(previous.data.length);for(let i=0;i<previous.data.length;i++){const oldCell=previous.data[i],key=cellKey(oldCell),nextCell=incoming.get(key);if(nextCell){nextCell[8]=225;aligned[i]=nextCell;incoming.delete(key)}else aligned[i]=[oldCell[0],oldCell[1],0,0,0,8,14,36,0]}for(const cell of incoming.values()){cell[8]=225;aligned.push(cell)}return {...payload,data:aligned}}
    function dataLayers(payload){const ease=t=>t*t*(3-2*t),result=[new deck.GridCellLayer({id:'viirs-grid',data:payload.data,getPosition:d=>[d[0],d[1]],getElevation:d=>d[4],getColor:d=>[d[5],d[6],d[7],d[8]??225],cellSize:payload.scale_m,coverage:.94,elevationScale:payload.elevation_scale,extruded:true,pickable:true,autoHighlight:true,highlightColor:[255,255,255,110],transitions:{getElevation:{duration:1500,easing:ease,enter:()=>[0]},getColor:{duration:1500,easing:ease,enter:value=>[value[0],value[1],value[2],0]}}})];result.push(new deck.GeoJsonLayer({id:'north-korea-boundary',data:payload.boundary,filled:false,stroked:true,getLineColor:[145,205,255,210],lineWidthMinPixels:1.5}));if(payload.top3?.length){result.push(new deck.ScatterplotLayer({id:'top3-point',data:payload.top3,getPosition:d=>[d.lon,d.lat],getRadius:420,radiusMinPixels:5,radiusMaxPixels:14,getFillColor:d=>d.rank===1?[255,225,86,245]:d.rank===2?[255,154,75,235]:[255,94,94,225],getLineColor:[255,255,255,230],lineWidthMinPixels:2,stroked:true,pickable:true}));if(showCityLabels)result.push(new deck.TextLayer({id:'top3-label',data:payload.top3,getPosition:d=>[d.lon,d.lat],getText:d=>`${d.rank}. ${d.city}`,characterSet:'auto',fontFamily:'"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif',getColor:[255,255,255,255],getSize:15,sizeUnits:'pixels',getPixelOffset:d=>[0,-24-d.displayIndex*28],getTextAnchor:'middle',getAlignmentBaseline:'bottom',fontWeight:800,billboard:true,background:true,getBackgroundColor:[5,12,28,220],backgroundPadding:[6,4],pickable:false}))}return result}
    function showPayload(payload){if(currentPayload?.month===payload.month)return;currentPayload=currentPayload?alignPayload(currentPayload,payload):payload;deckgl.setProps({layers:[basemap(),...dataLayers(currentPayload)]})}
    async function fetchMonth(item){if(cache.has(item.month))return cache.get(item.month);const response=await fetch(item.data_url);if(!response.ok)throw new Error(`${item.month} 데이터 ${response.status}`);const payload=await response.json();cache.set(item.month,payload);while(cache.size>2)cache.delete(cache.keys().next().value);return payload}
    async function selectMonth(index,{fromMessage=false}={}){if(!maps.length)return;activeIndex=(index+maps.length)%maps.length;const item=maps[activeIndex],token=++requestId;monthsEl.querySelectorAll('button').forEach((button,i)=>button.classList.toggle('active',i===activeIndex));monthsEl.querySelector('.active')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});currentEl.textContent=item.month;statusEl.textContent=`${item.month} 북한 격자 불러오는 중`;try{const payload=await fetchMonth(item);if(token!==requestId)return;const seenCities=new Set();payload.top3=(item.top3||[]).filter(location=>{if(seenCities.has(location.city))return false;seenCities.add(location.city);return true}).map((location,displayIndex)=>({...location,displayIndex}));showPayload(payload);const warning=item.coverage_status==='full'?'':` · 관측 범위 ${item.coverage_pct}%`;statusEl.textContent=`${item.month} · ${Number(payload.count).toLocaleString()}개 북한 격자${warning}`;if(!embed&&!fromMessage){const next=new URL(location.href);next.searchParams.set('month',item.month);history.replaceState(null,'',next)};const nextItem=maps[(activeIndex+1)%maps.length];if(nextItem)setTimeout(()=>fetchMonth(nextItem).catch(()=>{}),0)}catch(error){if(token===requestId)statusEl.textContent=`오류: ${error.message}`}}
    function stop(){if(timer)clearInterval(timer);timer=null;playEl.classList.remove('playing');playEl.textContent='▶ 재생'}
    playEl.onclick=()=>{if(timer){stop();return}playEl.classList.add('playing');playEl.textContent='■ 정지';timer=setInterval(()=>selectMonth(activeIndex+1),1500)};
    cityLabelsEl.onchange=()=>{showCityLabels=cityLabelsEl.checked;if(currentPayload)deckgl.setProps({layers:[basemap(),...dataLayers(currentPayload)]})};
    monthsEl.onclick=event=>{const button=event.target.closest('[data-index]');if(button){stop();selectMonth(Number(button.dataset.index))}};
    addEventListener('message',event=>{if(event.origin!==location.origin)return;if(event.data?.type==='north-korea-lights-month'){const index=maps.findIndex(item=>item.month===event.data.month);if(index>=0)selectMonth(index,{fromMessage:true});return}if(event.data?.type==='north-korea-lights-city-labels'){showCityLabels=event.data.visible===true;cityLabelsEl.checked=showCityLabels;if(currentPayload)deckgl.setProps({layers:[basemap(),...dataLayers(currentPayload)]})}});
    fetch('/api/poc/north-korea-night-lights/maps',{cache:'no-store'}).then(response=>response.json()).then(data=>{maps=data.maps||[];if(!maps.length)throw new Error('생성된 북한 월별 데이터가 없습니다.');monthsEl.innerHTML=maps.map((item,index)=>`<button class="month ${item.coverage_status}" type="button" data-index="${index}" title="유효 관측 격자 ${Number(item.count).toLocaleString()}개 · 기준 대비 ${item.coverage_pct}%">${item.month}${item.coverage_status==='full'?'':' ◐'}</button>`).join('');const requested=params.get('month'),index=Math.max(0,maps.findIndex(item=>item.month===(requested||data.default_month)));selectMonth(index)}).catch(error=>{statusEl.textContent=`오류: ${error.message}`;playEl.disabled=true});
  </script>
</body>
</html>
