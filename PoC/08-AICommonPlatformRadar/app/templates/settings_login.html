{% extends "base.html" %}
{% block title %}설정 로그인 · 조달체크{% endblock %}
{% block content %}
<section class="settings-login-wrap">
  <article class="panel settings-login-card">
    <span class="eyebrow">ADMIN SETTINGS</span>
    <h1>설정 로그인</h1>
    <p>담당자 정보, 메일 주소록과 판정오류 이력은 관리자만 확인할 수 있습니다.</p>
    {% if login_error %}<p class="error">{{ login_error }}</p>{% endif %}
    <form method="post" action="{{ url_for('settings_login').path }}">
      <label>아이디<input name="username" value="{{ admin_username }}" autocomplete="username" required></label>
      <label>암호<input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <button class="button primary" type="submit">설정 열기</button>
    </form>
  </article>
</section>
{% endblock %}
