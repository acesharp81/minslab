<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}공통기반 사업 레이더{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css').path }}">
  <script defer src="{{ url_for('static', path='app.js').path }}"></script>
</head>
<body data-base-path="{{ request.scope.get('app_root_path', request.scope.get('root_path', '')) }}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard').path }}"><span class="brand-mark">AI</span><span>공통기반 사업 레이더<small>나라장터 공개자료 모니터링</small></span></a>
    <nav>
      <a href="{{ url_for('dashboard').path }}">대시보드</a>
      <a href="{{ url_for('notices_page').path }}">공고 목록</a>
      <a href="{{ url_for('report_page').path }}">일일 리포트</a>
      {% if request.scope.get('app_root_path') == '/poc/ai-common-platform-radar' %}<a class="admin-link" href="/admin" target="_top">ADMIN 로그인</a>{% endif %}
      <button class="button primary" data-run-collect>지금 수집·판정</button>
    </nav>
  </header>
  <main class="shell">{% block content %}{% endblock %}</main>
  <div class="toast" data-toast role="status" aria-live="polite"></div>
</body>
</html>
