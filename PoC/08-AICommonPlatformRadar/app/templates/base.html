<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}조달체크 | 범정부 AI 공통기반 edition{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css').path }}">
  <script defer src="{{ url_for('static', path='app.js').path }}"></script>
</head>
<body data-base-path="{{ request.scope.get('app_root_path', request.scope.get('root_path', '')) }}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard').path }}"><span class="brand-mark">AI</span><span>조달체크 <b class="brand-edition">| 범정부 AI 공통기반 edition</b><small>나라장터 AI 사업, 자동으로 찾고 공통기반 활용까지 체크.</small></span></a>
    <nav>
      <a class="nav-item nav-install" href="{{ url_for('extension_install_page').path }}"><span class="nav-icon nav-macro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h10v14H7zM4 8h3m10 0h3M4 12h3m10 0h3M4 16h3m10 0h3"/><path d="m10 9 5 3-5 3z"/></svg></span><span>확장프로그램 설치</span></a>
      <a class="nav-item" href="{{ url_for('dashboard').path }}"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zm10 7h6V11h-6zM4 20h6v-3H4zm10-13h6V4h-6z"/></svg></span><span>대시보드</span></a>
      <a class="nav-item" href="{{ url_for('notices_page').path }}"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7M15 3v5h4"/></svg></span><span>공고 목록</span></a>
      <a class="nav-item" href="{{ url_for('report_page').path }}"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg></span><span>성과 통계</span></a>
      <a class="nav-item" href="{{ url_for('settings_page').path }}"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="m19 13.8 1.5 1.2-2 3.5-1.9-.7a8 8 0 0 1-2.1 1.2l-.3 2h-4l-.3-2a8 8 0 0 1-2.1-1.2l-1.9.7-2-3.5 1.5-1.2a8 8 0 0 1 0-2.5L4 10l2-3.5 1.9.7A8 8 0 0 1 10 6l.3-2h4l.3 2a8 8 0 0 1 2.1 1.2l1.9-.7 2 3.5-1.5 1.3a8 8 0 0 1 0 2.5z"/></svg></span><span>설정</span></a>
      <button class="button primary nav-action" data-run-collect><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 9M20 4v5h-5"/></svg></span><span>지금 수집·판정</span></button>
    </nav>
  </header>
  <main class="shell">{% block content %}{% endblock %}</main>
  <dialog class="classification-error-dialog" data-classification-error-dialog>
    <form data-classification-error-form>
      <input type="hidden" name="notice_id">
      <span class="eyebrow">CLASSIFICATION FEEDBACK</span><h2>판정오류 신고</h2>
      <p><strong data-error-notice-title></strong>을 부적합 상태로 변경합니다.</p>
      <label>잘못 판단한 이유<textarea name="reason" rows="6" minlength="10" maxlength="4000" required placeholder="공개 문서의 어떤 내용 때문에 현재 판정이 잘못됐는지 구체적으로 입력하세요."></textarea></label>
      <div class="dialog-actions"><button class="button" type="button" data-close-error-dialog>취소</button><button class="button danger" type="submit">부적합으로 변경</button></div>
    </form>
  </dialog>
  <div class="toast" data-toast role="status" aria-live="polite"></div>
</body>
</html>
