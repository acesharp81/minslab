      <div data-hf-id="hf-yfny" id="s4-root" data-composition-id="s4-close" data-width="1920" data-height="1080" data-duration="3.75">
        <svg data-hf-id="hf-qdvo" class="frame" id="s4-frame" viewBox="0 0 1920 1080" aria-hidden="true">
          <rect data-hf-id="hf-7fzu" id="s4-rect" x="48" y="48" width="1824" height="984" fill="none" stroke="#0b2b5a" stroke-width="2" />
        </svg>

        <div data-hf-id="hf-7g0o" class="eyebrow" id="s4-eyebrow">
          <span data-hf-id="hf-txoq" class="m">SHEET 04 / 04</span>
          <span data-hf-id="hf-h2ei" class="t">정리</span>
        </div>

        <svg data-hf-id="hf-dlzd" class="deco" id="s4-deco" viewBox="0 0 280 280" aria-hidden="true">
          <circle data-hf-id="hf-lpou" cx="140" cy="140" r="120" fill="none" stroke="#0b2b5a" stroke-width="3" />
          <circle data-hf-id="hf-kiye" cx="140" cy="140" r="70" fill="none" stroke="#0b2b5a" stroke-width="2" stroke-dasharray="10 10" />
          <path data-hf-id="hf-f65f" d="M140 6 V274 M6 140 H274" fill="none" stroke="#0b2b5a" stroke-width="3" />
          <circle data-hf-id="hf-s0zs" cx="140" cy="140" r="9" fill="#0b2b5a" />
        </svg>

        <div data-hf-id="hf-cjs0" class="block" id="s4-block">
          <div data-hf-id="hf-j8jm" class="title"><span data-hf-id="hf-eh8b" class="w" id="s4-w1">「주택</span><span data-hf-id="hf-fy33" class="w" id="s4-w2">파동」</span></div>
          <div data-hf-id="hf-4ntx" class="subt" id="s4-sub">주택공급 디지털 상황판 PoC</div>
          <div data-hf-id="hf-ncwx" class="tag" id="s4-tag">정책에서 입주까지, 한 화면에</div>
        </div>

        <div data-hf-id="hf-eln4" class="rule" id="s4-rule"></div>
        <div data-hf-id="hf-hlj2" class="stages" id="s4-stages">
          <span data-hf-id="hf-72w9" class="sg" id="s4-g1"><span data-hf-id="hf-87hp" class="m">01</span><span data-hf-id="hf-8ghu" class="k">정책</span></span>
          <span data-hf-id="hf-d8m2" class="sg" id="s4-g2"><span data-hf-id="hf-9ees" class="m">02</span><span data-hf-id="hf-c68p" class="k">사업화</span></span>
          <span data-hf-id="hf-h6q3" class="sg" id="s4-g3"><span data-hf-id="hf-903r" class="m">03</span><span data-hf-id="hf-3ih8" class="k">인허가</span></span>
          <span data-hf-id="hf-tp8k" class="sg" id="s4-g4"><span data-hf-id="hf-a70u" class="m">04</span><span data-hf-id="hf-qe3w" class="k">건설</span></span>
          <span data-hf-id="hf-ugwd" class="sg" id="s4-g5"><span data-hf-id="hf-9spt" class="m">05</span><span data-hf-id="hf-pr1q" class="k">공급</span></span>
          <span data-hf-id="hf-yf0e" class="sg" id="s4-g6"><span data-hf-id="hf-azmw" class="m">06</span><span data-hf-id="hf-xor1" class="k">입주</span></span>
        </div>

        <div data-hf-id="hf-m4wo" class="foot" id="s4-foot">
          <span data-hf-id="hf-dwwf"><span data-hf-id="hf-fc56" class="m">DATA</span>&#160; LH · SH · 국방부 · 국토교통부 · V-World · OpenStreetMap</span>
          <span data-hf-id="hf-0hyf"><span data-hf-id="hf-606j" class="m">TEAM</span>&#160; 전파도파민</span>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const BEAT = 60 / 128;

          const wf = (sel, t, dy, dur) => {
            tl.set(sel, { opacity: 1 }, t);
            tl.fromTo(sel, { y: dy }, { y: 0, duration: dur, ease: "power4.out", immediateRender: false }, t);
          };

          // 안쪽 테두리 — 금색 바탕 위 네이비
          const rect = document.getElementById("s4-rect");
          const len = rect.getTotalLength();
          rect.style.strokeDasharray = String(len);
          tl.fromTo("#s4-rect", { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 0.25);

          tl.fromTo("#s4-eyebrow", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.45);

          // 11.25s 임팩트 뒤 반 박(0.55s)에 타이틀, 2박(0.94s)에 부제, 3박(1.41s)에 한 줄
          wf("#s4-w1", 0.55, 130, 0.24);
          wf("#s4-w2", 0.68, 130, 0.24);
          tl.set("#s4-sub", { opacity: 1 }, BEAT * 2);
          tl.fromTo("#s4-sub", { y: 60 }, { y: 0, duration: 0.3, ease: "power4.out", immediateRender: false }, BEAT * 2);
          tl.set("#s4-tag", { opacity: 1 }, BEAT * 3);
          tl.fromTo("#s4-tag", { y: 48 }, { y: 0, duration: 0.3, ease: "power4.out", immediateRender: false }, BEAT * 3);

          // 6단계 줄이 박마다 정렬 (8마디 시작 = 1.875s부터)
          tl.fromTo("#s4-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, BEAT * 4 - 0.3);
          for (let k = 0; k < 6; k++) {
            const T = BEAT * 4 + k * (BEAT / 2);
            tl.set(`#s4-g${k + 1}`, { opacity: 1 }, T);
            tl.fromTo(`#s4-g${k + 1}`, { y: 36 }, { y: 0, duration: 0.24, ease: "power4.out", immediateRender: false }, T);
          }
          tl.fromTo("#s4-foot", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, BEAT * 4 + 1.5);

          tl.fromTo("#s4-deco", { opacity: 0, rotation: -50 }, { opacity: 0.55, rotation: 0, duration: 0.7, ease: "power3.out" }, 0.9);
          tl.fromTo("#s4-deco", { rotation: 0 }, { rotation: 50, duration: 2.2, ease: "none", immediateRender: false }, 1.6);

          // 마지막 프레임까지 아주 느린 밀어넣기
          tl.fromTo("#s4-block", { scale: 1, transformOrigin: "0% 50%" }, { scale: 1.02, duration: 3.2, ease: "none" }, 0.55);

          window.__timelines["s4-close"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
