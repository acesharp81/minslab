      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const BEAT = 60 / 128;
          const BAR = BEAT * 4;

          tl.fromTo("#s3-eyebrow", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.3);
          tl.fromTo("#s3-cap", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.45);
          tl.fromTo("#s3-credit", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.7);

          // 1) S2에서 모인 점(축소판 프레임)이 커진다 — 5.625s 드롭에 맞춤
          tl.fromTo("#s3-frame", { scale: 0.08 }, { scale: 1, duration: 0.62, ease: "power3.out" }, 0);
          tl.fromTo("#s3-corners", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 0.4);

          // 2) 수치 카드 1: 합계 카운트업 (counting-dynamic-scale)
          tl.fromTo("#s3-card1", { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.4);
          const state = { v: 0 };
          const COUNT_DUR = 1.4;
          tl.to(state, {
            v: 3173,
            duration: COUNT_DUR,
            ease: "power3.out",
            onUpdate: () => {
              document.getElementById("s3-count").textContent = Math.round(state.v).toLocaleString("en-US");
            },
          }, 0.5);
          tl.fromTo("#s3-count", { scale: 0.7 }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, 0.5);
          tl.fromTo("#s3-unit", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.5 + COUNT_DUR);

          // 3) 4마디(=1.875s): 보기 기준이 층수 → 공정율로 바뀌는 컷, 상태 3줄이 박마다 켜진다
          tl.fromTo("#s3-flash", { opacity: 0.45 }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, BAR);
          ["#s3-st1", "#s3-st2", "#s3-st3"].forEach((id, i) => {
            const T = BAR + i * BEAT;
            tl.fromTo(id, { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out" }, T);
            tl.fromTo(id + " .sw", { scale: 0.3 }, { scale: 1, duration: 0.3, ease: "power3.out" }, T);
          });

          // 4) 6마디 (3.75s): 공정율 카드 — 막대가 박에 맞춰 자란다
          tl.fromTo("#s3-card2", { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, BAR * 2);
          const FRACTION = [1, 0.113, 0.0174, 0.0085, 0.0042]; // 지도 화면의 공정율 그대로(A2·A3, A9, A10, A6, A17)
          ["#s3-p1", "#s3-p2", "#s3-p3", "#s3-p4", "#s3-p5"].forEach((id, i) => {
            const T = BAR * 2 + 0.2 + i * 0.1;
            const f = FRACTION[i];
            tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, T);
            tl.fromTo(id + " .bar", { scaleX: 0 }, { scaleX: f, duration: 0.8, ease: "power3.out" }, T);
          });
          // 준공 임박(A2·A3 100%)에 금색 강조 링 — 유한 반복
          tl.fromTo("#s3-p1", { boxShadow: "0 0 0 0px rgba(255,194,71,0)" },
            { boxShadow: "0 0 0 5px rgba(255,194,71,0.85)", duration: 0.3, ease: "power2.out", immediateRender: false }, BAR * 2 + 0.9);
          tl.fromTo("#s3-p1", { backgroundColor: "rgba(63,208,160,0)" },
            { backgroundColor: "rgba(63,208,160,0.16)", duration: 0.3, ease: "power2.out", immediateRender: false }, BAR * 2 + 0.9);

          window.__timelines["s3-map"] = tl;
        })();
      </script>
