x-home-logging: &home-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:16-3.5
    container_name: poc10-home-db
    logging: *home-logging
    mem_limit: 2g
    memswap_limit: 4g
    restart: unless-stopped
    environment:
      POSTGRES_USER: home
      POSTGRES_DB: home
      POSTGRES_PASSWORD: ${POC10_DB_PASSWORD:?Set POC10_DB_PASSWORD in .env}
    volumes:
      - home_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home -d home"]
      interval: 5s
      retries: 10
  api:
    build: .
    image: poc10-home:local
    container_name: poc10-home-api
    logging: *home-logging
    command: ["sh", "-c", "alembic upgrade head && uvicorn backend.app:app --host 0.0.0.0 --port 8000 --lifespan off"]
    networks: [default, ai-budget]
    mem_limit: 1536m
    memswap_limit: 3g
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      POC10_DATABASE_URL: postgresql+psycopg://home:${POC10_DB_PASSWORD}@db:5432/home
      POC10_AUTO_COLLECT: "false"
    ports:
      - "127.0.0.1:${POC10_HOST_PORT:-18100}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
  worker:
    image: poc10-home:local
    container_name: poc10-home-worker
    logging: *home-logging
    command: ["python", "-m", "backend.collection_worker"]
    mem_limit: 1536m
    memswap_limit: 2g
    cpus: 1.0
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      POC10_DATABASE_URL: postgresql+psycopg://home:${POC10_DB_PASSWORD}@db:5432/home
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json; from datetime import datetime,timezone; from pathlib import Path; p=json.loads(Path('/app/data/runtime/collection-worker-health.json').read_text()); assert (datetime.now(timezone.utc)-datetime.fromisoformat(p['checked_at'])).total_seconds()<90; assert {'home-source-worker-LATEST','home-source-worker-BACKFILL'} <= set(p['running_threads'])"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  area-worker:
    image: poc10-home:local
    container_name: poc10-home-area-worker
    logging: *home-logging
    command: ["python", "-m", "backend.area_snapshot_worker"]
    mem_limit: 1536m
    memswap_limit: 2g
    cpus: 0.75
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      POC10_DATABASE_URL: postgresql+psycopg://home:${POC10_DB_PASSWORD}@db:5432/home
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json; from datetime import datetime,timezone; from pathlib import Path; p=json.loads(Path('/app/data/runtime/area-snapshots/health.json').read_text()); assert (datetime.now(timezone.utc)-datetime.fromisoformat(p['checked_at'])).total_seconds()<90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  ai-worker:
    image: poc10-home:local
    container_name: poc10-home-ai-worker
    logging: *home-logging
    networks: [default, ai-budget]
    command: ["python", "-m", "backend.ai_collection_worker"]
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 0.5
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      POC10_DATABASE_URL: postgresql+psycopg://home:${POC10_DB_PASSWORD}@db:5432/home
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from backend.ai_worker_health import online; assert online('/app/data')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  home_pgdata:

networks:
  default:
    name: poc10-home
  ai-budget:
    name: minslab-ai-budget
    external: true
