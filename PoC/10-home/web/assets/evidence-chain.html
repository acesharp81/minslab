<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>더주택 · AI 근거 연결 과정</title>
<style>body{margin:0;background:#f5f7fa;color:#142638;font:16px/1.7 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:32px 22px}h1{font-size:30px;margin:6px 0}h2{font-size:21px}header{padding-bottom:22px;border-bottom:3px solid #177a76}.lead{color:#506478}.controls{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:22px 0}.card{background:#fff;border:1px solid #d9e3e9;border-radius:12px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.metric{font-size:25px;font-weight:700;color:#086964}.tag{display:inline-block;border-radius:5px;background:#e6f4ef;padding:3px 9px;font-size:13px}.held{background:#fff0d8;color:#7a4a00}blockquote{margin:14px 0;padding:12px 16px;border-left:4px solid #6a9caa;background:#f2f7f9;white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;font-size:13px;overflow-wrap:anywhere}small{color:#5c6e7d}a{color:#086d87;overflow-wrap:anywhere}input,select{max-width:100%;padding:8px}details{margin-top:12px}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #dce5ea}#status{color:#6b4d15}.note{font-size:14px;background:#eaf1f5;padding:12px 16px;border-radius:8px}@media print{.controls{display:none}.card{break-inside:avoid}body{background:#fff}}</style>
<main><header><small>더주택 · 실제 자료 검증</small><h1>AI의 자료 수집과 근거 연결 검토</h1><p class="lead">추출 규칙의 변경부터 원문 수집, 사업 단계의 근거와 남은 질문까지 확인합니다.</p></header>
<div class="controls"><label>저장 사례 <select id="saved"><option value="">사례를 선택하세요</option></select></label><label>결과 파일 열기 <input id="file" type="file" accept=".json,application/json"></label></div><p id="status" role="status">실제 실행 결과 파일(case.json)을 열거나 서비스에 저장된 사례를 선택하세요.</p><div id="case"></div></main>
<script>
'use strict';
const $=s=>document.querySelector(s), names={BUSINESS:'사업화',APPROVAL:'인허가',CONSTRUCTION:'착공·공사',COMPLETION:'준공',SUPPLY:'공급',MOVE_IN:'입주'};
function node(tag,text,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(parent)parent.append(n);return n;}
function card(title,parent=$('#case')){const c=node('section',undefined,parent);c.className='card';node('h2',title,c);return c;}
function sourceLink(url,parent){try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))return;const a=node('a','원문 열기',parent);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';}catch(_){}}
window.renderCase=function(data){if(!data||!data.project_id||!data.assessment)throw Error('검증 완료된 근거 연결 사례 파일이 아닙니다');$('#case').replaceChildren();$('#status').textContent='저장된 실제 실행 결과를 표시합니다. 이 화면에서 모델을 호출하거나 실적을 변경하지 않습니다.';
const intro=card(data.project_name||data.project_id);node('p','사업 '+data.project_id,intro);const note=node('p','원문 인용 검사와 AI 판단의 정확성은 별개입니다. 이 사례의 연결 결과는 검토 후보이며 공식 정책 실적에 합산되지 않습니다.',intro);note.className='note';
const g=node('div',undefined,intro);g.className='grid';for(const [label,value]of [['인용 검사를 통과한 후보',data.assessment.linked],['보류된 판단 후보',data.assessment.held],['공식 실적 변경',data.assessment.official_actuals_changed]]){const c=node('div',undefined,g);node('small',label,c);node('div',value??0,c).className='metric';}
const alg=card('1. 실제 추출 문제와 AI 진단·규칙 정비');const a=data.algorithm||{};if(a.rule_origin==='REVIEWED_AI_PROPOSAL')node('p','AI가 원인을 진단했고, 실행 규칙 형식은 개발 검토자가 정비했습니다. AI 단독 자동 수정 성공으로 해석하지 않습니다.',alg).className='note';node('p',a.proposal?.diagnosis||'기록 없음',alg);node('p',a.proposal?.reason||'',alg);node('pre',a.proposal?.selector||'',alg);node('p','저장 본문 '+(a.stored_before_chars??'미측정')+'자 → 규칙 적용 후 '+(a.after_chars??'미측정')+'자',alg);node('p','반복 추출의 모델 호출: '+(a.repeat_extraction_model_calls??'미측정')+'회 · 승인 범위: '+(a.activation_scope||'기록 확인 필요'),alg);for(const r of a.held_out||[])node('p','AI에 제시하지 않은 문서: '+(r.title||r.document_id)+' · '+(r.passed?'추출 검사 통과':'검토 필요'),alg);
const plan=card('2. 누락 근거 조사와 실제 수집');for(const missing of data.research_plan?.missing_information||[])node('p','필요한 근거: '+missing,plan);for(const query of data.collection||[]){node('h3',query.query,plan);node('p',query.status==='COMPLETED'?'검색 실행 완료':'검색 실패·제약 확인 필요',plan);if(!(query.results||[]).length)node('p','추가로 확보한 관련 공식 본문 없음',plan);for(const r of query.results||[]){node('p',r.status==='CAPTURED'?'공식 본문 '+r.chars+'자 확보':'원문 확보 실패',plan);sourceLink(r.url,plan);}}
const facts=card('3. 사업 단계 연결과 남은 확인사항');for(const f of data.assessment.findings||[]){const c=node('div',undefined,facts);node('h3',names[f.stage]||f.stage,c);node('span',({DIRECT:'원문에 직접 근거',INFERRED:'AI 추론',UNKNOWN:'미확인'})[f.basis]+' · '+(f.status==='HOLD'?'보류':'인용 검사 통과'),c).className='tag'+(f.status==='HOLD'?' held':'');node('p',f.reasoning,c);node('p','AI 제안 사건일: '+(f.event_date||'미확인')+' · 물량: '+(f.units==null?'미확인':f.units+'호')+' · 범위: '+f.scope_description,c);for(const e of f.evidence_spans||[]){node('blockquote',e.quote,c);sourceLink(e.url,c);node('small',' · 원문 위치 '+e.start+'–'+e.end+' · 판본 '+e.revision,c);}for(const e of [...(f.missing_information||[]),...(f.validation_errors||[])])node('p','확인 필요: '+e,c);}
const trace=card('실행 이력');node('p','실행 ID: '+data.run_id,trace);node('p','사례 ID: '+data.id,trace);node('p','실행 유형: '+data.execution_mode,trace);const d=node('details',undefined,trace);node('summary','모델 호출·판본·검증 기록 보기',d);node('pre',JSON.stringify({calls:data.model_calls,summary:data.summary},null,2),d);
};
$('#file').addEventListener('change',async e=>{try{window.renderCase(JSON.parse(await e.target.files[0].text()));}catch(error){$('#status').textContent=error.message;}});
const prefix=location.pathname.includes('/assets/')?location.pathname.split('/assets/')[0]:'';
if(location.protocol!=='file:'){fetch(prefix+'/api/ai-agents/evidence-cases').then(r=>{if(!r.ok)throw Error('사례 조회 연결 전입니다. 결과 JSON 파일을 열 수 있습니다.');return r.json();}).then(data=>{for(const item of data.items||[]){const o=node('option',item.project_name+' · '+item.created_at,$('#saved'));o.value=item.id;}}).catch(e=>{$('#status').textContent=e.message;});}
$('#saved').onchange=async e=>{if(!e.target.value)return;try{const r=await fetch(prefix+'/api/ai-agents/evidence-cases/'+encodeURIComponent(e.target.value));if(!r.ok)throw Error('저장 사례를 읽을 수 없습니다');window.renderCase(await r.json());}catch(error){$('#status').textContent=error.message;}};
</script></html>
