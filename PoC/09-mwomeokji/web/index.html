<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7ed">
  <title>ㅁㅁㅈ 뭐먹지? · 준비 중</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; color: #272118; background: #fff7ed; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(620px, 100%); padding: clamp(28px, 7vw, 52px); border: 1px solid #f3d6bb; border-radius: 28px; background: #fffdfa; box-shadow: 0 20px 65px #66360014; }
    .brand { display: inline-block; padding: 9px 14px; border-radius: 999px; background: #ff702e; color: white; font-size: 15px; font-weight: 800; letter-spacing: .04em; }
    h1 { margin: 24px 0 12px; font-size: clamp(34px, 7vw, 52px); line-height: 1.15; letter-spacing: -.045em; }
    p { margin: 0 0 16px; font-size: 17px; line-height: 1.7; word-break: keep-all; }
    .status { margin: 28px 0; padding: 18px 20px; border-radius: 18px; background: #fff0de; }
    .status strong { display: block; margin-bottom: 6px; font-size: 15px; }
    .status span { font-size: 14px; line-height: 1.6; }
    a { display: inline-flex; min-height: 44px; align-items: center; padding: 10px 16px; border-radius: 12px; background: #272118; color: white; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #ff702e; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="brand">ㅁㅁㅈ · 뭐먹지?</span>
    <h1>누구나, 자기 말로 주문할 수 있게.</h1>
    <p>상황과 취향을 말하면 실제 매장 메뉴에서 선택하고 주문까지 이어지는 서비스를 준비하고 있습니다.</p>
    <div class="status" role="status">
      <strong>현재는 팀 프로젝트 준비 단계입니다.</strong>
      <span>이 페이지에서는 아직 메뉴 조회나 주문을 할 수 없습니다. 서비스가 준비되면 이 주소에서 이용할 수 있습니다.</span>
    </div>
    <a href="/">MinsLab 홈으로</a>
  </main>
</body>
</html>
