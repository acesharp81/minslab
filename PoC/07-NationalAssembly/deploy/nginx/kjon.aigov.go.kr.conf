server {
    listen 80;
    server_name kjon.aigov.go.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://kjon.aigov.go.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name kjon.aigov.go.kr;

    ssl_certificate /etc/letsencrypt/live/kjon.aigov.go.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kjon.aigov.go.kr/privkey.pem;

    client_max_body_size 1m;

    # Speaker overrides require the parent site's administrator session.
    # The public domain has no equivalent administrator login.
    location ^~ /api/live/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18070;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host kjon.aigov.go.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:18070;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        send_timeout 180s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host kjon.aigov.go.kr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # The app sets the historical cookie path; this vhost exposes it at /.
        proxy_cookie_path /poc/national-assembly /;
    }
}
