services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      RAW_DATA_DIR: /app/data/raw
      PROCESSED_DATA_DIR: /app/data/processed
      AI_ENRICHMENT_ENABLED: ${AI_ENRICHMENT_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      MEETING_BRIEF_PROVIDER: ${MEETING_BRIEF_PROVIDER:-openrouter}
      MEETING_BRIEF_MODEL: ${MEETING_BRIEF_MODEL:-dots-studio/dots-3-note-preview:free}
      MEETING_BRIEF_MISTRAL_MODEL: ${MEETING_BRIEF_MISTRAL_MODEL:-mistral-small-2603}
      OPENROUTER_DAILY_LIMIT: ${OPENROUTER_DAILY_LIMIT:-950}
      OPENROUTER_GATEWAY_STATUS_URL: http://poc07-openrouter-gateway:8071/internal/status
      MISTRAL_MONTHLY_CREDIT_USD: ${MISTRAL_MONTHLY_CREDIT_USD:-10.0}
      MISTRAL_INPUT_USD_PER_MILLION: ${MISTRAL_INPUT_USD_PER_MILLION:-0.15}
      MISTRAL_OUTPUT_USD_PER_MILLION: ${MISTRAL_OUTPUT_USD_PER_MILLION:-0.60}
      WATCH_ALERTS_ENABLED: ${WATCH_ALERTS_ENABLED:-true}
      WATCH_TEST_BROADCASTS_ENABLED: ${WATCH_TEST_BROADCASTS_ENABLED:-true}
      WATCH_DIGEST_ENABLED: ${WATCH_DIGEST_ENABLED:-true}
      WATCH_KAKAO_ENABLED: ${WATCH_KAKAO_ENABLED:-false}
      WATCH_LLM_ENABLED: ${WATCH_LLM_ENABLED:-false}
      WATCH_LLM_PROVIDER: ${WATCH_LLM_PROVIDER:-openrouter}
      WATCH_LLM_MODEL: ${WATCH_LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      WATCH_LLM_MIN_NEW_MATCHES: ${WATCH_LLM_MIN_NEW_MATCHES:-3}
      WATCH_KAKAO_REDIRECT_URI: ${WATCH_KAKAO_REDIRECT_URI:-}
      WATCH_PUBLIC_BASE_URL: ${WATCH_PUBLIC_BASE_URL:-}
      WATCH_KAKAO_REST_API_KEY: ${WATCH_KAKAO_REST_API_KEY:-}
      WATCH_KAKAO_CLIENT_SECRET: ${WATCH_KAKAO_CLIENT_SECRET:-}
      WATCH_KAKAO_TOKEN_ENCRYPTION_KEY: ${WATCH_KAKAO_TOKEN_ENCRYPTION_KEY:-}
      WATCH_ADMIN_TOKEN: ${WATCH_ADMIN_TOKEN:-}
      WATCH_SESSION_COOKIE_NAME: ${WATCH_SESSION_COOKIE_NAME:-gukjeongbomi_session}
      WATCH_SESSION_COOKIE_PATH: ${WATCH_SESSION_COOKIE_PATH:-/poc/national-assembly}
      TOPIC_REPORTS_ENABLED: ${TOPIC_REPORTS_ENABLED:-true}
      TOPIC_REPORT_MODEL: ${TOPIC_REPORT_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      TOPIC_REPORT_DAILY_LIMIT: ${TOPIC_REPORT_DAILY_LIMIT:-100}
      TOPIC_REPORT_USER_DAILY_LIMIT: ${TOPIC_REPORT_USER_DAILY_LIMIT:-10}
      OFFICIAL_CHANGE_REPORTS_ENABLED: ${OFFICIAL_CHANGE_REPORTS_ENABLED:-true}
      OFFICIAL_CHANGE_REPORT_MODEL: ${OFFICIAL_CHANGE_REPORT_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OFFICIAL_CHANGE_REPORT_DAILY_LIMIT: ${OFFICIAL_CHANGE_REPORT_DAILY_LIMIT:-100}
      TOPIC_REPORT_MAX_PERIOD_DAYS: ${TOPIC_REPORT_MAX_PERIOD_DAYS:-366}
    ports:
      - "${NATIONAL_ASSEMBLY_PORT:-8070}:8070"
    volumes:
      - ./data:/app/data
      - ./web:/app/web:ro
    depends_on:
      db:
        condition: service_healthy
      openrouter-gateway:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-national_assembly}
      POSTGRES_USER: ${POSTGRES_USER:-national_assembly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-national_assembly}
    volumes:
      - national_assembly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-national_assembly} -d ${POSTGRES_DB:-national_assembly}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  openrouter-gateway:
    container_name: poc07-openrouter-gateway
    build:
      context: ./backend
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_METER_TOKEN: ${OPENROUTER_METER_TOKEN:-}
      OPENROUTER_UPSTREAM_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_GATEWAY_DB: /app/data/openrouter_gateway.sqlite3
      OPENROUTER_OFFICIAL_DAILY_LIMIT: 1000
      OPENROUTER_OPERATIONAL_DAILY_LIMIT: 950
      OPENROUTER_RPM_LIMIT: 18
      OPENROUTER_MAX_INFLIGHT: 4
      OPENROUTER_FREE_MODELS: nvidia/nemotron-3-super-120b-a12b:free,liquid/lfm-2.5-2.6b:free,dots-studio/dots-3-note-preview:free
    command: ["uvicorn", "app.openrouter_gateway:app", "--app-dir", "/app/backend", "--host", "0.0.0.0", "--port", "8071"]
    ports:
      - "127.0.0.1:18071:8071"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8071/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  live-monitor:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      RAW_DATA_DIR: /app/data/raw
      PROCESSED_DATA_DIR: /app/data/processed
    command: ["python", "-m", "app.ingestion.live_monitor", "--interval", "30"]
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  schedule-worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      RAW_DATA_DIR: /app/data/raw
      PROCESSED_DATA_DIR: /app/data/processed
      NATIONAL_ASSEMBLY_API_KEY: ${NATIONAL_ASSEMBLY_API_KEY:-}
    command: ["python", "-m", "app.ingestion.schedule_worker", "--interval", "600", "--days", "7"]
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  caption-worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      RAW_DATA_DIR: /app/data/raw
      PROCESSED_DATA_DIR: /app/data/processed
    command: ["python", "-m", "app.ingestion.caption_worker", "--workers", "4"]
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  review-worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
    command: ["python", "-m", "app.ingestion.review_worker", "--interval", "10"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  watch-worker:
    container_name: poc07-national-assembly-watch-worker
    image: poc07-national-assembly-api:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      WATCH_ALERTS_ENABLED: ${WATCH_ALERTS_ENABLED:-true}
      WATCH_TEST_BROADCASTS_ENABLED: ${WATCH_TEST_BROADCASTS_ENABLED:-true}
      WATCH_DIGEST_ENABLED: ${WATCH_DIGEST_ENABLED:-true}
      WATCH_KAKAO_ENABLED: ${WATCH_KAKAO_ENABLED:-false}
      WATCH_LLM_ENABLED: ${WATCH_LLM_ENABLED:-false}
    command: ["python", "-m", "app.ingestion.watch_worker", "--interval", "1"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    container_name: poc07-national-assembly-notification-worker
    image: poc07-national-assembly-api:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      WATCH_KAKAO_ENABLED: ${WATCH_KAKAO_ENABLED:-false}
      WATCH_KAKAO_REDIRECT_URI: ${WATCH_KAKAO_REDIRECT_URI:-}
      WATCH_PUBLIC_BASE_URL: ${WATCH_PUBLIC_BASE_URL:-}
      WATCH_KAKAO_REST_API_KEY: ${WATCH_KAKAO_REST_API_KEY:-}
      WATCH_KAKAO_CLIENT_SECRET: ${WATCH_KAKAO_CLIENT_SECRET:-}
      WATCH_KAKAO_TOKEN_ENCRYPTION_KEY: ${WATCH_KAKAO_TOKEN_ENCRYPTION_KEY:-}
    command: ["python", "-m", "app.ingestion.notification_worker", "--interval", "2"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  watch-summary-worker:
    container_name: poc07-national-assembly-watch-summary-worker
    image: poc07-national-assembly-api:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      WATCH_LLM_ENABLED: ${WATCH_LLM_ENABLED:-false}
      WATCH_LLM_PROVIDER: ${WATCH_LLM_PROVIDER:-openrouter}
      WATCH_LLM_MODEL: ${WATCH_LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_API_KEY: gateway-local
      OPENROUTER_BASE_URL: http://poc07-openrouter-gateway:8071/api/v1
      OPENROUTER_DAILY_LIMIT: 950
      WATCH_LLM_MONTHLY_BUDGET_USD: ${WATCH_LLM_MONTHLY_BUDGET_USD:-1.0}
      WATCH_LLM_DEBOUNCE_SECONDS: ${WATCH_LLM_DEBOUNCE_SECONDS:-30}
      WATCH_LLM_MIN_NEW_MATCHES: ${WATCH_LLM_MIN_NEW_MATCHES:-3}
      WATCH_LLM_MAX_UPDATES_PER_SESSION: ${WATCH_LLM_MAX_UPDATES_PER_SESSION:-12}
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_MODEL: ${LLM_MODEL:-}
    command: ["python", "-m", "app.ingestion.watch_summary_worker", "--interval", "10"]
    depends_on:
      db:
        condition: service_healthy
      openrouter-gateway:
        condition: service_healthy
    restart: unless-stopped

  topic-report-worker:
    container_name: poc07-national-assembly-topic-report-worker
    image: poc07-national-assembly-api:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      TOPIC_REPORTS_ENABLED: ${TOPIC_REPORTS_ENABLED:-true}
      TOPIC_REPORT_MODEL: ${TOPIC_REPORT_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      TOPIC_REPORT_DAILY_LIMIT: ${TOPIC_REPORT_DAILY_LIMIT:-100}
      TOPIC_REPORT_USER_DAILY_LIMIT: ${TOPIC_REPORT_USER_DAILY_LIMIT:-10}
      OPENROUTER_API_KEY: gateway-local
      OPENROUTER_BASE_URL: http://poc07-openrouter-gateway:8071/api/v1
      OPENROUTER_DAILY_LIMIT: 950
    command: ["python", "-m", "app.ingestion.topic_report_worker", "--interval", "2"]
    depends_on:
      db:
        condition: service_healthy
      openrouter-gateway:
        condition: service_healthy
    restart: unless-stopped

  executive-caption-worker:
    container_name: poc07-national-assembly-executive-caption-worker
    image: poc07-national-assembly-api:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      RAW_DATA_DIR: /app/data/raw
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      MISTRAL_MONTHLY_CREDIT_USD: ${MISTRAL_MONTHLY_CREDIT_USD:-10.0}
      EXECUTIVE_TRANSCRIPTION_MODEL: ${EXECUTIVE_TRANSCRIPTION_MODEL:-voxtral-mini-latest}
      EXECUTIVE_AUDIO_CHUNK_SECONDS: ${EXECUTIVE_AUDIO_CHUNK_SECONDS:-60}
      EXECUTIVE_TRANSCRIPTION_USD_PER_MINUTE: ${EXECUTIVE_TRANSCRIPTION_USD_PER_MINUTE:-0.003}
    command: ["python", "-m", "app.ingestion.executive_caption_worker", "--interval", "5"]
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  summary-worker:
    container_name: poc07-national-assembly-summary-worker
    image: poc07-national-assembly-api:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      AI_ENRICHMENT_ENABLED: ${AI_ENRICHMENT_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_API_KEY: gateway-local
      OPENROUTER_BASE_URL: http://poc07-openrouter-gateway:8071/api/v1
      OPENROUTER_DAILY_LIMIT: 950
    command: ["python", "-m", "app.ingestion.summary_worker", "--interval", "2"]
    depends_on:
      db:
        condition: service_healthy
      openrouter-gateway:
        condition: service_healthy
    restart: unless-stopped

  meeting-brief-worker:
    container_name: poc07-national-assembly-meeting-brief-worker
    image: poc07-national-assembly-api:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      AI_ENRICHMENT_ENABLED: ${AI_ENRICHMENT_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      MEETING_BRIEF_PROVIDER: ${MEETING_BRIEF_PROVIDER:-openrouter}
      MEETING_BRIEF_MODEL: ${MEETING_BRIEF_MODEL:-dots-studio/dots-3-note-preview:free}
      MEETING_BRIEF_MISTRAL_MODEL: ${MEETING_BRIEF_MISTRAL_MODEL:-mistral-small-2603}
      OPENROUTER_API_KEY: gateway-local
      OPENROUTER_BASE_URL: http://poc07-openrouter-gateway:8071/api/v1
      OPENROUTER_DAILY_LIMIT: 950
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      MISTRAL_MONTHLY_CREDIT_USD: ${MISTRAL_MONTHLY_CREDIT_USD:-10.0}
      MISTRAL_INPUT_USD_PER_MILLION: ${MISTRAL_INPUT_USD_PER_MILLION:-0.15}
      MISTRAL_OUTPUT_USD_PER_MILLION: ${MISTRAL_OUTPUT_USD_PER_MILLION:-0.60}
    command: ["python", "-m", "app.ingestion.meeting_brief_worker", "--interval", "60"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  official-minutes-worker:
    container_name: poc07-national-assembly-official-minutes-worker
    image: poc07-national-assembly-api:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      RAW_DATA_DIR: /app/data/raw
      NATIONAL_ASSEMBLY_API_KEY: ${NATIONAL_ASSEMBLY_API_KEY:-}
    command: ["python", "-m", "app.ingestion.official_minutes_worker", "--interval", "300"]
    # A malformed or unexpectedly large official transcript must not evict
    # PoC7 PostgreSQL or PoC8 SQLite pages from the shared host.
    mem_limit: 2g
    memswap_limit: 2560m
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  official-integration-worker:
    container_name: poc07-national-assembly-official-integration-worker
    image: poc07-national-assembly-api:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://national_assembly:national_assembly@db:5432/national_assembly}
      AI_ENRICHMENT_ENABLED: ${AI_ENRICHMENT_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_API_KEY: gateway-local
      OPENROUTER_BASE_URL: http://poc07-openrouter-gateway:8071/api/v1
      OPENROUTER_DAILY_LIMIT: 950
    command: ["python", "-m", "app.ingestion.official_integration_worker", "--interval", "15", "--limit", "5"]
    depends_on:
      db:
        condition: service_healthy
      openrouter-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  national_assembly_pgdata:

networks:
  default:
    name: poc07-national-assembly
    external: true
